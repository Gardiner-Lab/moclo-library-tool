name: Build and Push Container

# Pushing a version tag (v1.12.0) tests the code, then publishes the image as
# ghcr.io/gardiner-lab/moclo-library-tool:1.12.0, :1.12 and :latest, for Intel
# and ARM servers.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gardiner-lab/moclo-library-tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cairo, for image export
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install -r requirements.txt
      - name: Tests
        # The app creates its data folder on import; /data is not writable here.
        env:
          DATABASE_PATH: ${{ runner.temp }}/data/moclo.db
          PARTS_DATABASE_PATH: ${{ runner.temp }}/data/parts.db
          BACKUP_DIR: ${{ runner.temp }}/data/backups
        run: python -m pytest -q -o addopts=''

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" app/main.py)"
          [ "$tag" = "$code" ] || { echo "Tag v$tag but APP_VERSION is $code"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release tag also moves :latest (metadata-action's default for semver).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
