services:
  web:
    image: ghcr.io/gardiner-lab/moclo-library-tool:latest
    container_name: moclo-library-tool
    ports:
      - "5000:5000"
    volumes:
      - moclo-data:/data
    environment:
      - FLASK_ENV=production
      # Set a real secret: `SECRET_KEY=$(openssl rand -hex 32) docker compose ... up -d`
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY to a random value, e.g. openssl rand -hex 32}
      - DATABASE_PATH=/data/moclo.db
      - PARTS_DATABASE_PATH=/data/parts.db
      - BACKUP_DIR=/data/backups
    restart: unless-stopped

volumes:
  moclo-data:
