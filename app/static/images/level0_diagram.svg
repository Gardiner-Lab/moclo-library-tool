<svg font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2b2620">Level 0: Basic Parts</text>
  
  <!-- Promoter Part -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="150" height="80" fill="#2b8040" rx="5"/>
    <text x="75" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Promoter</text>
    <text x="75" y="50" font-size="12" text-anchor="middle" fill="white">Position 1</text>
    <text x="75" y="70" font-size="10" text-anchor="middle" fill="white">GGAG → TACT</text>
    
    <!-- BsaI sites -->
    <rect x="-10" y="25" width="8" height="30" fill="#b42318"/>
    <rect x="152" y="25" width="8" height="30" fill="#b42318"/>
    <text x="-5" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
    <text x="156" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
  </g>
  
  <!-- 5' UTR Part -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="150" height="80" fill="#2a7480" rx="5"/>
    <text x="75" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5'UTR</text>
    <text x="75" y="50" font-size="12" text-anchor="middle" fill="white">Position 2</text>
    <text x="75" y="70" font-size="10" text-anchor="middle" fill="white">TACT → AATG</text>
    
    <!-- BsaI sites -->
    <rect x="-10" y="25" width="8" height="30" fill="#b42318"/>
    <rect x="152" y="25" width="8" height="30" fill="#b42318"/>
    <text x="-5" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
    <text x="156" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
  </g>
  
  <!-- CDS Part -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="150" height="80" fill="#7a4a8f" rx="5"/>
    <text x="75" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white">CDS</text>
    <text x="75" y="50" font-size="12" text-anchor="middle" fill="white">Position 3</text>
    <text x="75" y="70" font-size="10" text-anchor="middle" fill="white">AATG → AGGT</text>
    
    <!-- BsaI sites -->
    <rect x="-10" y="25" width="8" height="30" fill="#b42318"/>
    <rect x="152" y="25" width="8" height="30" fill="#b42318"/>
    <text x="-5" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
    <text x="156" y="95" font-size="9" text-anchor="middle" fill="#b42318">BsaI</text>
  </g>
  
  <!-- Terminator Part -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="150" height="80" fill="#b42318" rx="5"/>
    <text x="75" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Terminator</text>
    <text x="75" y="50" font-size="12" text-anchor="middle" fill="white">Position 4</text>
    <text x="75" y="70" font-size="10" text-anchor="middle" fill="white">AGGT → GCTT</text>
    
    <!-- BsaI sites -->
    <rect x="-10" y="25" width="8" height="30" fill="#9a1d14"/>
    <rect x="152" y="25" width="8" height="30" fill="#9a1d14"/>
    <text x="-5" y="95" font-size="9" text-anchor="middle" fill="#9a1d14">BsaI</text>
    <text x="156" y="95" font-size="9" text-anchor="middle" fill="#9a1d14">BsaI</text>
  </g>
  
  <!-- Description -->
  <text x="400" y="220" font-size="14" text-anchor="middle" fill="#6f665c">Each Level 0 part contains:</text>
  <text x="400" y="245" font-size="12" text-anchor="middle" fill="#6f665c">• BsaI recognition sites (red bars) flanking the genetic element</text>
  <text x="400" y="265" font-size="12" text-anchor="middle" fill="#6f665c">• Position-specific 4-bp overhangs that determine assembly order</text>
  <text x="400" y="285" font-size="12" text-anchor="middle" fill="#6f665c">• Compatible overhangs ensure parts connect in the correct sequence</text>
  
  <!-- Key -->
  <g transform="translate(250, 320)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2b2620">Key:</text>
    <rect x="0" y="10" width="30" height="15" fill="#2b8040" rx="2"/>
    <text x="35" y="22" font-size="11" fill="#6f665c">Promoter</text>
    
    <rect x="100" y="10" width="30" height="15" fill="#2a7480" rx="2"/>
    <text x="135" y="22" font-size="11" fill="#6f665c">5'UTR</text>
    
    <rect x="200" y="10" width="30" height="15" fill="#7a4a8f" rx="2"/>
    <text x="235" y="22" font-size="11" fill="#6f665c">CDS</text>
    
    <rect x="280" y="10" width="30" height="15" fill="#b42318" rx="2"/>
    <text x="315" y="22" font-size="11" fill="#6f665c">Terminator</text>
  </g>
</svg>
